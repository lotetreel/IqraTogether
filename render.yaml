services:
  - type: web
    name: iqratogether-server
    env: node
    rootDir: ./server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
  - type: web
    name: iqratogether-client
    env: static
    rootDir: ./client
    buildCommand: npm install && npm run build
    publishDir: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
